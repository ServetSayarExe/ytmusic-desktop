name: YTMusic
options:
  bundleIdPrefix: com.servetsayar
  deploymentTarget:
    iOS: "16.0"
targets:
  YTMusic:
    type: application
    platform: iOS
    sources:
      - path: YTMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servetsayar.ytmusic
        PRODUCT_NAME: YTMusic
        INFOPLIST_FILE: YTMusic/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
