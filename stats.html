<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>İstatistikler</title>
<style>
  :root { --accent: #ff4d6d; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b10; color: #fff; min-height: 100vh;
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .hero {
    padding: 34px 40px 22px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 45%, #0b0b10), #0b0b10);
  }
  h1 { margin: 0; font: 800 34px/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.02em; }
  .sub { color: rgba(255,255,255,.7); margin-top: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px; }
  .pill {
    border: 0; border-radius: 999px; padding: 8px 15px; cursor: pointer; font: 600 13px inherit; font-family: inherit;
    background: rgba(255,255,255,.1); color: #fff; transition: background .15s;
  }
  .pill:hover { background: rgba(255,255,255,.18); }
  .pill.on { background: #fff; color: #0b0b10; }
  .spacer { flex: 1; }
  main { padding: 10px 40px 50px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); border-radius: 18px; padding: 18px 20px; }
  .big { font: 800 34px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -0.02em; }
  .label { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 6px; }
  h2 { font-size: 20px; margin: 30px 0 12px; }
  .top1 { display: flex; gap: 22px; align-items: center; padding: 20px; border-radius: 22px;
    background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 30%, transparent), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.08); }
  .top1.row img, .top1 .ph { width: 130px; height: 130px; border-radius: 14px; object-fit: cover; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .top1 .t { font: 800 26px/1.15 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 10px; cursor: pointer; }
  .row:hover { background: rgba(255,255,255,.07); }
  .rank { width: 22px; text-align: right; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
  .row img, .ph { width: 42px; height: 42px; border-radius: 7px; object-fit: cover; background: #222; flex: none; }
  .ph { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 60%, #222), #222); }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .meta span { color: rgba(255,255,255,.6); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .count { color: rgba(255,255,255,.6); font-size: 13px; white-space: nowrap; }
  .art { margin-bottom: 12px; }
  .art .name { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 5px; }
  .art .track { height: 8px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
  .art .fill { height: 100%; border-radius: 8px; background: var(--accent); }
  .hours { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 10px; }
  .hours div { flex: 1; background: color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .hlabels { display: flex; justify-content: space-between; color: rgba(255,255,255,.45); font-size: 11px; margin-top: 6px; }
  input.search {
    width: 100%; max-width: 420px; padding: 11px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06); color: #fff; font: inherit; outline: none; margin: 16px 0 6px;
  }
  input.search:focus { border-color: rgba(255,255,255,.3); }
  .day { margin: 22px 0 6px; font-weight: 700; color: rgba(255,255,255,.85); }
  .time { width: 44px; color: rgba(255,255,255,.5); font-size: 13px; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: rgba(255,255,255,.6); padding: 70px 20px; font-size: 16px; }

  /* ---------- Hedefler ---------- */
  .goalTop { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
  .ring { position: relative; width: 220px; height: 220px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .in b { font: 800 40px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .ring .in span { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 6px; }
  .streaks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .flame { font-size: 26px; }
  .week { display: flex; gap: 10px; align-items: flex-end; height: 150px; position: relative; padding-top: 10px; }
  .week .d { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .week .b { width: 100%; max-width: 46px; border-radius: 8px 8px 4px 4px; background: rgba(255,255,255,.12); min-height: 4px; }
  .week .b.ok { background: var(--accent); }
  .week .d span { font-size: 12px; color: rgba(255,255,255,.55); }
  .week .line { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(255,255,255,.3); }
  .goalpick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .badge { border-radius: 18px; padding: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); text-align: center; }
  .badge .e { font-size: 38px; filter: grayscale(1) opacity(.35); }
  .badge.got { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 28%, transparent), rgba(255,255,255,.03)); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .badge.got .e { filter: none; }
  .badge b { display: block; margin-top: 6px; }
  .badge span { display: block; color: rgba(255,255,255,.55); font-size: 12px; margin-top: 3px; }
  .badge .pb { height: 5px; border-radius: 5px; background: rgba(255,255,255,.08); margin-top: 10px; overflow: hidden; }
  .badge .pb i { display: block; height: 100%; background: rgba(255,255,255,.4); border-radius: 5px; }
  .wrapBtn { background: linear-gradient(90deg, var(--accent), #8b5cf6); color: #fff; }
  .wrapBtn:hover { filter: brightness(1.1); background: linear-gradient(90deg, var(--accent), #8b5cf6); }

  /* ---------- Yıllık özet (Wrapped) ---------- */
  #wrap { position: fixed; inset: 0; z-index: 50; background: #07070b; display: none; overflow: hidden; }
  #wrap.on { display: block; }
  #wrap .bgA, #wrap .bgB { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; filter: blur(90px); opacity: .65; transition: background 1s ease; }
  #wrap .bgA { left: -30vmax; top: -40vmax; animation: wdrift 16s ease-in-out infinite alternate; }
  #wrap .bgB { right: -35vmax; bottom: -45vmax; animation: wdrift 20s ease-in-out infinite alternate-reverse; }
  @keyframes wdrift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  .wsegs { position: absolute; top: 16px; left: 20px; right: 70px; display: flex; gap: 6px; z-index: 3; }
  .wsegs div { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
  .wsegs i { display: block; height: 100%; width: 0; background: #fff; }
  .wsegs .done i { width: 100%; }
  .wsegs .cur i { animation: wfill var(--dur, 7s) linear forwards; }
  #wrap.paused .wsegs .cur i { animation-play-state: paused; }
  @keyframes wfill { to { width: 100%; } }
  .wx { position: absolute; top: 8px; right: 16px; z-index: 4; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; cursor: pointer; }
  .wnav { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 2; cursor: pointer; }
  .wnav.l { left: 0; } .wnav.r { right: 0; }
  .wslide { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 60px 8vw; }
  .wslide > * { opacity: 0; transform: translateY(26px); animation: wup .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .wslide > *:nth-child(2) { animation-delay: .25s; } .wslide > *:nth-child(3) { animation-delay: .5s; }
  .wslide > *:nth-child(4) { animation-delay: .75s; } .wslide > *:nth-child(5) { animation-delay: 1s; }
  @keyframes wup { to { opacity: 1; transform: none; } }
  .wk { font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .wh { font: 900 clamp(34px, 6vw, 76px)/1.02 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -0.03em; margin: 14px 0; max-width: 1000px; }
  .whuge { font: 900 clamp(70px, 15vw, 190px)/0.95 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -0.05em; }
  .wp { font-size: clamp(16px, 1.8vw, 22px); color: rgba(255,255,255,.8); max-width: 640px; }
  .wcover { width: min(34vh, 300px); height: min(34vh, 300px); border-radius: 20px; object-fit: cover; box-shadow: 0 30px 80px rgba(0,0,0,.6); margin-bottom: 10px; }
  .wcover.round { border-radius: 50%; }
  .wlist { text-align: left; width: min(560px, 90vw); margin-top: 10px; }
  .wlist .it { display: flex; align-items: center; gap: 16px; padding: 8px 0; opacity: 0; animation: wup .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .wlist .n { font: 900 34px "Segoe UI Variable Display", sans-serif; width: 44px; color: rgba(255,255,255,.5); }
  .wlist img, .wlist .ph { width: 58px; height: 58px; border-radius: 8px; }
  .wlist b { display: block; font-size: 18px; } .wlist span { color: rgba(255,255,255,.65); }
  .wfinal { display: flex; gap: 14px; margin-top: 18px; }
  .wfinal .pill { padding: 12px 20px; font-size: 15px; }
  .wfinal, .wcard { position: relative; z-index: 3; }
  .wcard { height: min(64vh, 700px); width: auto; max-width: 80vw; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .hidden { display: none; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }
</style>
</head>
<body>
  <div class="hero">
    <h1>Dinleme istatistiklerin</h1>
    <div class="sub" id="sub">Yükleniyor…</div>
    <div class="bar">
      <button class="pill on" data-tab="summary">Özet</button>
      <button class="pill" data-tab="history">Geçmiş</button>
      <button class="pill" data-tab="goals">Hedefler</button>
      <button class="pill wrapBtn" id="openWrap">✨ Yıllık özetin</button>
      <span class="spacer"></span>
      <button class="pill" data-p="7">7 gün</button>
      <button class="pill on" data-p="30">30 gün</button>
      <button class="pill" data-p="365">1 yıl</button>
      <button class="pill" data-p="0">Tüm zamanlar</button>
    </div>
  </div>
  <main>
    <section id="summary"></section>
    <section id="goals" class="hidden"></section>
    <section id="history" class="hidden">
      <input class="search" id="q" placeholder="Geçmişte ara: şarkı veya sanatçı">
      <div id="hlist"></div>
    </section>
  </main>
  <div id="wrap">
    <div class="bgA"></div><div class="bgB"></div>
    <div class="wsegs" id="wsegs"></div>
    <button class="wx" id="wx" title="Kapat (Esc)">✕</button>
    <div class="wnav l" id="wl"></div><div class="wnav r" id="wr"></div>
    <div id="wstage"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const h = (tag, props = {}, kids = []) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
      else if (k === 'style') e.style.cssText = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    kids.forEach((c) => c && e.appendChild(c)); return e;
  };
  const img = (src, size = 120) => {
    if (!/^https:\/\//.test(src || '')) return h('div', { class: 'ph' });
    const i = h('img', { src: src.replace(/=w\d+-h\d+/, `=w${size}-h${size}`), alt: '' });
    i.onerror = () => i.replaceWith(h('div', { class: 'ph' }));
    return i;
  };
  const firstArtist = (a) => String(a || '').split(/,|&| x | X | ve | feat\.? | ft\.? /)[0].trim() || 'Bilinmeyen';
  const dur = (sec) => { const m = Math.round(sec / 60); return m < 60 ? `${m} dk` : `${Math.floor(m / 60)} sa ${m % 60} dk`; };

  let all = [], period = 30, tab = 'summary';
  const play = (id) => id && window.ytmd.playVideo(id);

  function filtered() {
    if (!period) return all;
    const from = Date.now() - period * 86400000;
    return all.filter((x) => x.t >= from);
  }

  function renderSummary() {
    const list = filtered();
    const box = $('summary'); box.replaceChildren();
    if (list.length < 1) { box.append(h('div', { class: 'empty', text: 'Bu dönemde henüz dinleme yok. Biraz müzik dinle, burası dolacak 🎧' })); return; }
    const sec = list.reduce((s, x) => s + (x.sec || 0), 0);
    const songs = new Map(), artists = new Map(), hours = new Array(24).fill(0);
    for (const x of list) {
      const k = x.id || x.title + '|' + x.artist;
      const s = songs.get(k) || { ...x, plays: 0, secs: 0 }; s.plays++; s.secs += x.sec || 0; songs.set(k, s);
      const a = firstArtist(x.artist); artists.set(a, (artists.get(a) || 0) + (x.sec || 0));
      hours[new Date(x.t).getHours()] += x.sec || 0;
    }
    const topSongs = [...songs.values()].sort((a, b) => b.plays - a.plays || b.secs - a.secs).slice(0, 10);
    const topArtists = [...artists.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
    const maxA = topArtists[0] ? topArtists[0][1] : 1, maxH = Math.max(...hours, 1);
    const peak = hours.indexOf(Math.max(...hours));

    box.append(h('div', { class: 'cards' }, [
      h('div', { class: 'card' }, [h('div', { class: 'big', text: dur(sec) }), h('div', { class: 'label', text: 'toplam dinleme' })]),
      h('div', { class: 'card' }, [h('div', { class: 'big', text: String(list.length) }), h('div', { class: 'label', text: 'dinlenen şarkı' })]),
      h('div', { class: 'card' }, [h('div', { class: 'big', text: String(songs.size) }), h('div', { class: 'label', text: 'farklı şarkı' })])
    ]));
    const t1 = topSongs[0];
    box.append(h('h2', { text: 'Bir numaran' }));
    box.append(h('div', { class: 'top1 row', onclick: () => play(t1.id) }, [
      img(t1.art, 300),
      h('div', {}, [
        h('div', { class: 'kicker', text: 'En çok dinlediğin şarkı' }),
        h('div', { class: 't', text: t1.title }),
        h('div', { class: 'sub', text: `${t1.artist} · ${t1.plays} kez · ${dur(t1.secs)}` })
      ])
    ]));
    const songsCol = h('div', {}, [h('h2', { text: 'En çok dinlediğin şarkılar' })]);
    topSongs.forEach((s, i) => songsCol.append(h('div', { class: 'row', title: 'Çal', onclick: () => play(s.id) }, [
      h('div', { class: 'rank', text: String(i + 1) }), img(s.art),
      h('div', { class: 'meta' }, [h('b', { text: s.title }), h('span', { text: s.artist })]),
      h('div', { class: 'count', text: `${s.plays} kez` })
    ])));
    const artCol = h('div', {}, [h('h2', { text: 'En çok dinlediğin sanatçılar' })]);
    topArtists.forEach(([name, s]) => artCol.append(h('div', { class: 'art' }, [
      h('div', { class: 'name' }, [h('span', { text: name }), h('span', { class: 'count', text: dur(s) })]),
      h('div', { class: 'track' }, [h('div', { class: 'fill', style: `width:${Math.max(4, s / maxA * 100)}%` })])
    ])));
    artCol.append(h('h2', { text: `En çok ${String(peak).padStart(2, '0')}:00 civarı dinliyorsun` }));
    artCol.append(h('div', { class: 'hours' }, hours.map((v, i) => h('div', { title: `${i}:00 — ${dur(v)}`, style: `height:${v / maxH * 100}%` }))));
    artCol.append(h('div', { class: 'hlabels' }, ['00', '06', '12', '18', '23'].map((t) => h('span', { text: t }))));
    box.append(h('div', { class: 'grid2' }, [songsCol, artCol]));
  }

  function dayLabel(d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const day = new Date(d); day.setHours(0, 0, 0, 0);
    const diff = Math.round((today - day) / 86400000);
    if (diff === 0) return 'Bugün'; if (diff === 1) return 'Dün';
    return day.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long', year: day.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
  }
  function renderHistory() {
    const q = $('q').value.trim().toLocaleLowerCase('tr');
    const list = filtered().filter((x) => !q || (x.title + ' ' + x.artist).toLocaleLowerCase('tr').includes(q)).slice().reverse().slice(0, 1500);
    const box = $('hlist'); box.replaceChildren();
    if (!list.length) { box.append(h('div', { class: 'empty', text: q ? 'Eşleşen dinleme yok.' : 'Bu dönemde henüz dinleme yok.' })); return; }
    let last = '';
    for (const x of list) {
      const lbl = dayLabel(x.t);
      if (lbl !== last) { last = lbl; box.append(h('div', { class: 'day', text: lbl })); }
      box.append(h('div', { class: 'row', title: 'Çal', onclick: () => play(x.id) }, [
        h('div', { class: 'time', text: new Date(x.t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) }),
        img(x.art), h('div', { class: 'meta' }, [h('b', { text: x.title }), h('span', { text: x.artist })])
      ]));
    }
  }
  function render() {
    for (const t of ['summary', 'history', 'goals']) $(t).classList.toggle('hidden', tab !== t);
    tab === 'summary' ? renderSummary() : tab === 'history' ? renderHistory() : renderGoals();
  }
  // tarih dışı sekmelerde dönem düğmeleri anlamsız
  const periodBtns = () => document.querySelectorAll('[data-p]');

  /* ================= Hedefler ve rozetler ================= */
  let goalMin = 30;
  const dayKey = (t) => { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  function perDay() { const m = new Map(); for (const x of all) { const k = dayKey(x.t); m.set(k, (m.get(k) || 0) + (x.sec || 0)); } return m; }
  function streaks(per, goalSec) {
    const d = new Date(); d.setHours(12, 0, 0, 0);
    if ((per.get(dayKey(d)) || 0) < goalSec) d.setDate(d.getDate() - 1);
    let cur = 0; while ((per.get(dayKey(d)) || 0) >= goalSec) { cur++; d.setDate(d.getDate() - 1); }
    const days = [...per.entries()].filter(([, v]) => v >= goalSec).map(([k]) => new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100, 12).getTime()).sort((a, b) => a - b);
    let best = 0, run = 0, prev = 0;
    for (const t of days) { run = prev && Math.round((t - prev) / 86400000) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; }
    return { cur, best: Math.max(best, cur), daysMet: days.length };
  }
  function badgeList(per, st) {
    const total = all.reduce((s, x) => s + (x.sec || 0), 0);
    const artists = new Set(all.map((x) => firstArtist(x.artist)));
    const songCount = new Map(); for (const x of all) { const k = x.id || x.title; songCount.set(k, (songCount.get(k) || 0) + 1); }
    const maxSong = Math.max(0, ...songCount.values());
    const night = all.filter((x) => { const h = new Date(x.t).getHours(); return h < 5; }).length;
    const early = all.filter((x) => { const h = new Date(x.t).getHours(); return h >= 5 && h < 8; }).length;
    const maxDay = Math.max(0, ...per.values());
    const B = (e, name, desc, val, need) => ({ e, name, desc, val: Math.min(val, need), need, got: val >= need });
    return [
      B('🎵', 'İlk nota', 'İlk şarkını dinle', all.length, 1),
      B('💯', 'Yüzlük', '100 şarkı dinle', all.length, 100),
      B('🏆', 'Bin şarkı', '1000 şarkı dinle', all.length, 1000),
      B('⏱️', '10 saat', 'Toplam 10 saat dinle', Math.floor(total / 3600), 10),
      B('🚀', '100 saat', 'Toplam 100 saat dinle', Math.floor(total / 3600), 100),
      B('🔥', 'Isınma turu', '3 gün üst üste hedefi tuttur', st.best, 3),
      B('📅', 'Haftalık seri', '7 gün üst üste hedefi tuttur', st.best, 7),
      B('👑', 'Ay boyu', '30 gün üst üste hedefi tuttur', st.best, 30),
      B('🌙', 'Gece kuşu', 'Gece 00–05 arası 25 şarkı', night, 25),
      B('🌅', 'Erken kalkan', 'Sabah 05–08 arası 25 şarkı', early, 25),
