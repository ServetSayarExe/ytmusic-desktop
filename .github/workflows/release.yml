# Yeni sürüm: package.json'daki "version"ı artır, GitHub'da "v1.2.3" etiketiyle bir sürüm (tag) oluştur
# ya da Actions sekmesinden bu iş akışını elle çalıştır. Kurulum dosyası otomatik derlenip yayınlanır,
# kullanıcıların uygulaması kendini günceller.
name: Sürüm derle ve yayınla

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
